name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validar:
    name: Validar Python e estrutura do dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r generator/requirements.txt
      - name: Verificar sintaxe Python
        run: python -m compileall -q generator dashboard tests
      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v
      - name: Conferir quantidade de consultas do dashboard
        run: test "$(find sql/03_dashboard -maxdepth 1 -name '*.sql' | wc -l)" -eq 8
